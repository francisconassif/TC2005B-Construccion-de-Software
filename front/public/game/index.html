<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Web Player | TC2005</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      (function () {
        try {
          const userString = localStorage.getItem("authUser");
          if (!userString) {
            window.location.replace("/login");
            return;
          }

          let userId = null;
          try {
            const parsed = JSON.parse(userString);
            userId = parsed?.id || parsed?.userId || null;
          } catch {
            userId = userString;
          }

          if (!userId) {
            window.location.replace("/login");
            return;
          }

          const currentUrl = new URL(window.location.href);
          if (currentUrl.searchParams.get("playerId") !== String(userId)) {
            currentUrl.searchParams.set("playerId", String(userId));
            window.history.replaceState({}, "", currentUrl.toString());
          }
        } catch {
          window.location.replace("/login");
        }
      })();
    </script>
  </head>
  <body class="bg-warning-subtle">
    <div id="app-navbar"></div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">TC2005</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildName = "Snake";
      var loaderUrl = buildUrl + "/" + buildName + ".loader.js";
      var config = {
        dataUrl: buildUrl + "/" + buildName + ".data",
        frameworkUrl: buildUrl + "/" + buildName + ".framework.js",
        codeUrl: buildUrl + "/" + buildName + ".wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TC2005",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          try {
            
            const currentUrl = new URL(window.location.href);
            const userId = currentUrl.searchParams.get("playerId");

            if (!userId) {
              throw new Error("user id not found");
            }

            const apiBaseUrl = "http://localhost:5000";

            
            fetch(`${apiBaseUrl}/usuario/${userId}/score`)
              .then(response => response.json())
              .then(dadosUsuario => {
                
                const stringDeDados = `${dadosUsuario.nome}|${dadosUsuario.recorde}`;
                
                unityInstance.SendMessage("WebBridge", "ReceberDadosDoUsuario", stringDeDados);
              })
              .catch(err => console.error("game error", err));

            window.dispatchUnityScore = function(novoRecorde) {
              console.log("new high score: ", novoRecorde);
              
              fetch(`${apiBaseUrl}/usuario/${userId}/score`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ novoRecorde: novoRecorde })
              }).then(() => {
                console.log("score updated");
              }).catch(err => console.error("error saving the score", err));
            };

          } catch (e) {
            console.error("game error", e);
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/navbar.js"></script>
  </body>
</html>
